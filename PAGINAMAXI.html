<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máximo Asencio | Contacto</title>
    <style>
        :root {
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --accent: #e94560;
            --text: #f5f5f7;
            --muted: #a0a0b8;
            --whatsapp: #25D366;
            --gmail: #EA4335;
            --empresa: #4fc3f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(233, 69, 96, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(69, 133, 233, 0.08) 0%, transparent 60%);
        }

        .card {
            background: var(--card);
            border-radius: 2rem;
            padding: 3rem 2.5rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.8s ease-out;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), #ff6b6b, #ffb3b3, var(--accent));
            background-size: 200% auto;
            animation: shimmer 3s linear infinite;
            border-radius: 2rem 2rem 0 0;
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #ff8a5c);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 1.5rem;
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 8px 30px rgba(233, 69, 96, 0.35);
            letter-spacing: -1px;
        }

        h1 {
            color: var(--text);
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: var(--accent);
            border-radius: 99px;
            margin: 1rem auto 1.5rem;
            opacity: 0.8;
        }

        .info-label {
            color: var(--muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 0.8rem;
        }

        .contact-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            margin-top: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            padding: 0.9rem 1.6rem;
            border-radius: 99px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        .btn svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            fill: currentColor;
        }

        .btn-phone {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-phone:hover {
            background: rgba(233, 69, 96, 0.15);
            border-color: rgba(233, 69, 96, 0.4);
            box-shadow: 0 0 25px rgba(233, 69, 96, 0.2);
            transform: translateY(-2px);
        }

        .btn-whatsapp {
            background: var(--whatsapp);
            color: #fff;
            border: 1px solid var(--whatsapp);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            background: #1eb855;
            border-color: #1eb855;
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.45);
            transform: translateY(-2px);
        }

        .btn-gmail {
            background: rgba(234, 67, 53, 0.1);
            color: #fff;
            border: 1px solid rgba(234, 67, 53, 0.4);
        }

        .btn-gmail:hover {
            background: rgba(234, 67, 53, 0.25);
            border-color: var(--gmail);
            box-shadow: 0 0 20px rgba(234, 67, 53, 0.3);
            transform: translateY(-2px);
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border: 1px dashed rgba(255, 255, 255, 0.3);
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .email-display {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.8rem;
            border-radius: 1rem;
            margin-bottom: 0.5rem;
            color: var(--text);
            font-size: 1rem;
            letter-spacing: 0.5px;
            word-break: break-all;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .empresa-display {
            background: rgba(79, 195, 247, 0.1);
            padding: 0.6rem 1rem;
            border-radius: 99px;
            margin: 0.5rem auto 1rem;
            color: var(--empresa);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            border: 1px solid rgba(79, 195, 247, 0.3);
            display: inline-block;
        }

        .footer-text {
            margin-top: 2rem;
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 1.5rem;
            }

            h1 {
                font-size: 1.6rem;
            }

            .btn {
                font-size: 1rem;
                padding: 0.8rem 1.2rem;
            }

            .avatar {
                width: 70px;
                height: 70px;
                font-size: 1.8rem;
            }

            .contact-buttons {
                gap: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">MA</div>
        <h1>Máximo Asencio</h1>
        <div class="divider"></div>

        <!-- Teléfono -->
        <p class="info-label">Teléfono</p>
        <div class="contact-buttons" style="margin-top: 0.5rem;">
            <a href="tel:+56976555970" class="btn btn-phone">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
                Llamar ahora
            </a>
            <a href="https://wa.me/56976555970" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                </svg>
                WhatsApp
            </a>
        </div>

        <!-- Correo electrónico -->
        <p class="info-label" style="margin-top: 1.5rem;">Correo electrónico</p>
        <div class="email-display" id="emailText">maximoasencio@estudiantelicap.cl</div>
        <div class="contact-buttons" style="margin-top: 0.5rem;">
            <button class="btn btn-copy" onclick="copiarEmail()">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                </svg>
                Copiar correo
            </button>
            <a href="https://mail.google.com" target="_blank" rel="noopener noreferrer" class="btn btn-gmail">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/>
                </svg>
                Abrir Gmail
            </a>
        </div>

        <!-- Empresa -->
        <p class="info-label" style="margin-top: 1.5rem;">Empresa</p>
        <div class="empresa-display">licap2025</div>

        <p class="footer-text">Me llamo Máximo Asencio y mi número de teléfono es +56 97655 5970</p>
    </div>

    <script>
        function copiarEmail() {
            const email = document.getElementById('emailText').innerText;
            navigator.clipboard.writeText(email).then(() => {
                alert('Correo copiado al portapapeles');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = email;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('Correo copiado al portapapeles');
            });
        }
    </script>
</body>
</html>
